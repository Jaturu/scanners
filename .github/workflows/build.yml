name: build-scanners

on:
  schedule:
    - cron: "17 1 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild both variants even if no input changed
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml

permissions:
  contents: read

concurrency:
  group: scanners
  cancel-in-progress: false

jobs:
  # Pins every build input and compares its fingerprint with the label on the
  # published floating tag. A variant only builds when its inputs changed.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.in.outputs.image }}
      stamp: ${{ steps.in.outputs.stamp }}
      build_args: ${{ steps.in.outputs.build_args }}
      fp_slim: ${{ steps.fp.outputs.slim }}
      fp_full: ${{ steps.fp.outputs.full }}
      build_slim: ${{ steps.cmp.outputs.slim }}
      build_full: ${{ steps.cmp.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Upstream repos come from the Dockerfile ARG defaults, pinned here by digest.
      - name: Resolve and pin upstream inputs
        id: in
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          arg() { sed -n "s/^ARG $1=//p" Dockerfile; }
          pin() { echo "${1%:*}@$(docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' | tr -d '"')"; }
          trivy=$(gh api repos/aquasecurity/trivy/releases/latest --jq .tag_name)
          grype=$(gh api repos/anchore/grype/releases/latest --jq .tag_name)
          syft=$(gh api repos/anchore/syft/releases/latest --jq .tag_name)
          g=$(curl -fsS https://grype.anchore.io/databases/v6/latest.json)
          args=$(cat <<EOF
          TRIVY_VERSION=${trivy#v}
          GRYPE_VERSION=${grype}
          SYFT_VERSION=${syft}
          BASE_IMAGE=$(pin "$(arg BASE_IMAGE)")
          TRIVY_DB_REPO=$(pin "$(arg TRIVY_DB_REPO)")
          TRIVY_JAVA_DB_REPO=$(pin "$(arg TRIVY_JAVA_DB_REPO)")
          TRIVY_CHECKS_REPO=$(pin "$(arg TRIVY_CHECKS_REPO)")
          GRYPE_DB_URL=https://grype.anchore.io/databases/v6/$(jq -er .path <<<"$g")?checksum=$(jq -er '.checksum|@uri' <<<"$g")
          EOF
          )
          echo "$args"
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/scanners"
            echo "stamp=$(date -u +%Y%m%d.%H%M)"
            echo "build_args<<EOF"; echo "$args"; echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute fingerprints
        id: fp
        env:
          ARGS: ${{ steps.in.outputs.build_args }}
        run: |
          set -euo pipefail
          slim=$( { grep -v '^TRIVY_JAVA_DB_REPO=' <<<"$ARGS"
                    sha256sum Dockerfile .github/workflows/build.yml; } | sha256sum | cut -d' ' -f1)
          full=$( { echo "$slim"; grep '^TRIVY_JAVA_DB_REPO=' <<<"$ARGS"; } | sha256sum | cut -d' ' -f1)
          echo "slim=$slim" | tee -a "$GITHUB_OUTPUT"
          echo "full=$full" | tee -a "$GITHUB_OUTPUT"

      - name: Compare with published images
        id: cmp
        env:
          IMAGE: ${{ steps.in.outputs.image }}
          FP_SLIM: ${{ steps.fp.outputs.slim }}
          FP_FULL: ${{ steps.fp.outputs.full }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          # Only a genuine not-found means "never published"; other errors fail the run.
          current() {
            local out
            if out=$(docker buildx imagetools inspect "$1" \
                --format '{{ index (index .Image "linux/amd64").Config.Labels "io.scanners.fingerprint" }}' 2>&1); then
              echo "$out"
            elif grep -qiE 'not found|MANIFEST_UNKNOWN|NAME_UNKNOWN|404' <<<"$out"; then
              echo ""
            else
              echo "$out" >&2; return 1
            fi
          }
          cur_slim=$(current "$IMAGE:slim")
          cur_full=$(current "$IMAGE:latest")
          decide() { if [ "$FORCE" = true ] || [ "$1" != "$2" ]; then echo true; else echo false; fi; }
          echo "slim=$(decide "$cur_slim" "$FP_SLIM")" | tee -a "$GITHUB_OUTPUT"
          echo "full=$(decide "$cur_full" "$FP_FULL")" | tee -a "$GITHUB_OUTPUT"

  # One native runner per architecture: builds and pushes by digest.
  build:
    needs: check
    if: needs.check.outputs.build_slim == 'true' || needs.check.outputs.build_full == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    env:
      IMAGE: ${{ needs.check.outputs.image }}
      BUILD_SLIM: ${{ needs.check.outputs.build_slim }}
      BUILD_FULL: ${{ needs.check.outputs.build_full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Derive platform slug and SOURCE_DATE_EPOCH
        run: |
          p="${{ matrix.platform }}"
          echo "SLUG=${p//\//-}" >> "$GITHUB_ENV"
          # Constant across nightly runs, so unchanged files produce identical layers.
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push slim by digest
        id: slim
        if: env.BUILD_SLIM == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          target: slim
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: ${{ needs.check.outputs.build_args }}
          labels: io.scanners.fingerprint=${{ needs.check.outputs.fp_slim }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true,compression=zstd,force-compression=true

      # Same builder and build args as slim, so the shared stages come from cache.
      - name: Build and push full by digest
        id: full
        if: env.BUILD_FULL == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          target: full
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: ${{ needs.check.outputs.build_args }}
          labels: io.scanners.fingerprint=${{ needs.check.outputs.fp_full }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true,compression=zstd,force-compression=true

      - name: Export digests
        env:
          SLIM: ${{ steps.slim.outputs.digest }}
          FULL: ${{ steps.full.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          [ -z "$SLIM" ] || echo "$SLIM" > "/tmp/digests/slim-$SLUG"
          [ -z "$FULL" ] || echo "$FULL" > "/tmp/digests/full-$SLUG"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digests-${{ env.SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Runs once both architectures pushed: merges digests, tags, promotes.
  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      IMAGE: ${{ needs.check.outputs.image }}
      STAMP: ${{ needs.check.outputs.stamp }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge, tag, and promote
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          ls -l
          publish() {  # variant, dated tag, floating tag
            local refs=() f
            for f in "$1"-*; do [ -e "$f" ] && refs+=("$IMAGE@$(cat "$f")"); done
            [ "${#refs[@]}" -eq 0 ] && return 0
            [ "${#refs[@]}" -eq 2 ] || { echo "$1: expected 2 platform digests, got ${#refs[@]}" >&2; exit 1; }
            docker buildx imagetools create -t "$IMAGE:$2" "${refs[@]}"
            docker buildx imagetools create -t "$IMAGE:$3" "$IMAGE:$2"
          }
          publish slim "$STAMP-slim" slim
          publish full "$STAMP" latest

  # Keeps the newest KEEP builds per variant; deletes every other version,
  # including per-arch manifests of pruned builds and leftovers of failed runs.
  cleanup:
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      IMAGE: ${{ needs.check.outputs.image }}
      KEEP: 3
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prune old builds
        run: |
          set -euo pipefail
          api="/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${IMAGE##*/}/versions"
          gh api --paginate "$api?per_page=100" \
            --jq '.[] | [.id, .name, (.metadata.container.tags | join(","))] | @tsv' > versions.tsv
          dated() {  # newest KEEP digests whose tag matches $1
            awk -F'\t' -v re="$1" '{ n = split($3, t, ","); for (i = 1; i <= n; i++) if (t[i] ~ re) print t[i] "\t" $2 }' versions.tsv \
              | sort -r | head -n "$KEEP" | cut -f2
          }
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' | tr -d '"'; echo; }
          keep=$( { dated '^[0-9]{8}[.][0-9]{4}$'; dated '^[0-9]{8}[.][0-9]{4}-slim$'
                    digest "$IMAGE:latest"; digest "$IMAGE:slim"; } | sort -u)
          [ -n "$keep" ] || { echo "nothing to keep; refusing to prune" >&2; exit 1; }
          protected=$(for d in $keep; do echo "$d"
            docker buildx imagetools inspect --raw "$IMAGE@$d" | jq -r '.manifests[]?.digest'; done | sort -u)
          echo "Protected:"; echo "$protected"
          while IFS=$'\t' read -r id name tags; do
            grep -qxF "$name" <<<"$protected" && continue
            echo "Deleting $name ${tags:-(untagged)}"
            [ -n "${DRY_RUN:-}" ] || gh api -X DELETE "$api/$id" --silent
          done < versions.tsv
